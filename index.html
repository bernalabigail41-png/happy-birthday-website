<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    overflow:hidden;
    background:url("background.png") center center/cover no-repeat fixed;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("lips.jpg") center center/cover no-repeat;
    opacity:0.10;
    pointer-events:none;
    z-index:0;
}

.page{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:1;
}

.hidden{
    display:none;
}

h1{
    color:white;
    font-size:60px;
    text-shadow:0 0 20px hotpink;
    margin-top:20px;
}

button{
    margin-top:30px;
    padding:15px 40px;
    font-size:22px;
    border:none;
    border-radius:40px;
    background:#ff4f93;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#cake{
    font-size:180px;
    position:absolute;
    top:-250px;
    animation:cakeDrop 3s forwards;
}

@keyframes cakeDrop{
0%{top:-250px;}
100%{top:40px;}
}

#message{
    width:85%;
    max-width:900px;
    color:white;
    font-size:22px;
    line-height:1.9;
    text-align:center;
    white-space:pre-wrap;
    text-shadow:0 0 10px black;
    margin-top:40px;
}

.heart{
    position:absolute;
    color:#ff4f93;
    animation:float 7s linear infinite;
    opacity:.8;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div id="page1" class="page">

<div id="cake">🎂</div>

<h1>🎉 Happy Birthday! 🎉</h1>

<button onclick="openLetter()">Proceed ❤️</button>

</div>

<div id="page2" class="page hidden">

<div id="message"></div>

<audio id="music" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

</div>

<script>

const text=`Happy Birthday, My Love! ❤️

Today is one of the most special days in the world because today is the day you were born. I just want to thank God for bringing someone as beautiful, kind, caring, and amazing as you into this world.

From the moment you became part of my life, everything felt brighter. Your smile has a way of making my worries disappear, your laughter is my favorite sound, and your happiness has become something I always wish for every single day.

On your birthday, I hope you receive all the love, happiness, and blessings that you truly deserve. You deserve every beautiful thing this world has to offer because you have such a beautiful heart.

Thank you for being patient with me, for making me smile even on difficult days, and for simply being yourself. I appreciate every little thing you do, even the things you think go unnoticed.

I wish you success in everything you dream of. I hope every goal you have becomes a reality. I hope your heart stays filled with joy, your smile never fades, and your life continues to be surrounded by people who truly love and care for you.

Always remember that no matter what happens, you are never alone. I'll always be here cheering for you, believing in you, and supporting you through every chapter of your life.

You are one of the greatest blessings that ever happened to me, and meeting you is something I'll always be thankful for.

May this birthday be filled with unforgettable memories, endless laughter, wonderful surprises, and all the happiness your heart can hold.

Happy Birthday once again, my love. ❤️

I love you more than words can ever describe, today, tomorrow, and every single day after this.

Happy Birthday! 🎂❤️`;

let i=0;

function typeWriter(){

if(i<text.length){

document.getElementById("message").innerHTML+=text.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

function openLetter(){

document.getElementById("page1").classList.add("hidden");

document.getElementById("page2").classList.remove("hidden");

typeWriter();

const music=document.getElementById("music");

music.play().catch(()=>{});

setInterval(createHeart,300);

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💗";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*40)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

}

</script>

</body>
</html>
